<svg xmlns="http://www.w3.org/2000/svg" width="140" height="150" viewBox="0 0 140 150">
  <title>Leo, papyonlu smokin kedi</title>
  <style>
    .kuyruk { transform-origin: 88px 128px; animation: salla 2.8s ease-in-out infinite alternate; }
    .goz { transform-box: fill-box; transform-origin: center; animation: kirp 4.5s infinite; }
    @keyframes salla { from { transform: rotate(-8deg); } to { transform: rotate(8deg); } }
    @keyframes kirp { 0%, 93%, 100% { transform: scaleY(1); } 96% { transform: scaleY(.1); } }
    @media (prefers-reduced-motion: reduce) { .kuyruk, .goz { animation: none; } }
  </style>

  <!-- Kuyruk (gövdenin arkasında) -->
  <path class="kuyruk" d="M88 128 C 118 128 124 98 112 78" fill="none" stroke="#1b1b1f" stroke-width="10" stroke-linecap="round"/>

  <!-- Gövde, beyaz gömlek, patiler -->
  <ellipse cx="70" cy="108" rx="36" ry="34" fill="#1b1b1f"/>
  <path d="M56 84 Q70 79 84 84 Q82 112 70 128 Q58 112 56 84 Z" fill="#ffffff"/>
  <rect x="50" y="116" width="14" height="24" rx="7" fill="#1b1b1f"/>
  <rect x="76" y="116" width="14" height="24" rx="7" fill="#1b1b1f"/>
  <ellipse cx="57" cy="139" rx="9" ry="6" fill="#ffffff"/>
  <ellipse cx="83" cy="139" rx="9" ry="6" fill="#ffffff"/>

  <!-- Kulaklar -->
  <path d="M45 44 L44 16 L65 32 Z" fill="#1b1b1f"/>
  <path d="M95 44 L96 16 L75 32 Z" fill="#1b1b1f"/>
  <path d="M48.5 37 L48 24 L59 32 Z" fill="#f4a6b8"/>
  <path d="M91.5 37 L92 24 L81 32 Z" fill="#f4a6b8"/>

  <!-- Kafa ve beyaz burun-ağız bölgesi -->
  <circle cx="70" cy="58" r="30" fill="#1b1b1f"/>
  <path d="M70 40 C 66 48 62 54 57 60 C 50 67 52 78 62 81 C 66 82 74 82 78 81 C 88 78 90 67 83 60 C 78 54 74 48 70 40 Z" fill="#ffffff"/>

  <!-- Gözler -->
  <g class="goz">
    <ellipse cx="56.5" cy="54" rx="5.5" ry="6.5" fill="#f5c518"/>
    <ellipse cx="56.5" cy="54" rx="1.8" ry="5" fill="#111111"/>
    <circle cx="58.2" cy="51.6" r="1.4" fill="#ffffff"/>
  </g>
  <g class="goz">
    <ellipse cx="83.5" cy="54" rx="5.5" ry="6.5" fill="#f5c518"/>
    <ellipse cx="83.5" cy="54" rx="1.8" ry="5" fill="#111111"/>
    <circle cx="85.2" cy="51.6" r="1.4" fill="#ffffff"/>
  </g>

  <!-- Burun, ağız, bıyıklar -->
  <path d="M66.5 64 L73.5 64 L70 68.5 Z" fill="#f08aa5"/>
  <path d="M70 68.5 L70 71 M70 71 Q66 75 63 72 M70 71 Q74 75 77 72" fill="none" stroke="#555555" stroke-width="1.3" stroke-linecap="round"/>
  <g stroke="#d9d9d9" stroke-width="1" stroke-linecap="round">
    <path d="M58 68 L35 63"/>
    <path d="M58 71 L35 72"/>
    <path d="M59 74 L37 80"/>
    <path d="M82 68 L105 63"/>
    <path d="M82 71 L105 72"/>
    <path d="M81 74 L103 80"/>
  </g>

  <!-- Papyon -->
  <path d="M70 87 L56 80 L56 94 Z" fill="#d6224a"/>
  <path d="M70 87 L84 80 L84 94 Z" fill="#d6224a"/>
  <circle cx="70" cy="87" r="3.5" fill="#a5112f"/>
</svg>

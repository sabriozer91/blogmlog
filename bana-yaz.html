      <hr class="gokkusagi">

      <section class="yazi">
        <h1>Bana Yaz!</h1>
        <p>Bir şey sormak, merhaba demek ya da bir şarkı önermek istersen formu doldurman yeterli. Mesajın doğrudan bana gelecek :)</p>

        <!-- Şimdilik gönderim yok; bana-yaz.js sadece teşekkür ekranını gösterir.
             FormSubmit sonra bağlanacak, gizli alanlar ve tuzak alanı onun için. -->
        <form class="mektup" id="mektup">
          <input type="hidden" name="_subject" value="blogmlog'dan yeni mesaj!">
          <input type="hidden" name="_template" value="box">
          <input class="bal-kupu" type="text" name="_honey" tabindex="-1" autocomplete="off" aria-hidden="true">

          <label for="ad">Adın:</label>
          <input id="ad" name="Ad" type="text" required maxlength="80" autocomplete="name">

          <label for="eposta">E-posta adresin:</label>
          <input id="eposta" name="email" type="email" required maxlength="120" autocomplete="email">

          <label for="mesaj">Mesajın:</label>
          <textarea id="mesaj" name="Mesaj" rows="7" required maxlength="3000"></textarea>

          <div class="mektup-dugmeler">
            <button class="klasik-dugme" type="submit">Gönder</button>
            <button class="klasik-dugme" type="reset">Temizle</button>
          </div>
          <p class="mektup-durum" role="status" aria-live="polite"></p>
        </form>

        <div class="gonderildi" tabindex="-1" hidden>
          <p class="gonderildi-mesaj">Mesajın uçtu gitti! Teşekkürler :)</p>
        </div>
      </section>

      <hr class="gokkusagi">
